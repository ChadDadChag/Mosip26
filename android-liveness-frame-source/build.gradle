// Minimal Android library module config for CameraXFrameSource.
// NOT part of the Desktop Maven reactor and not built from here: the Android
// Registration Client's android/liveness module compiles the synced copy of the
// source (android-integration/scripts/sync-engine.ps1) with these CameraX versions.
plugins {
    id 'com.android.library'
}

android {
    namespace 'io.mosip.registration.liveness.device.android'
    compileSdk 34

    defaultConfig {
        minSdk 24   // CameraX minimum
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation project(':liveness-api')   // pure-Java contract module
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.google.guava:guava:32.1.3-android'  // ListenableFuture
}
