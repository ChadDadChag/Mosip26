<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 0 1120 780" role="img" aria-label="User flow 4: device error" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'Noto Sans Arabic', sans-serif">
<title>User flow 4: device error</title>
<defs><marker id="aC62828" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0.8 L9.6 5 L0 9.2 z" fill="#C62828"/></marker><marker id="aC62828s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M10 0.8 L0.4 5 L10 9.2 z" fill="#C62828"/></marker><marker id="a2E7D32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0.8 L9.6 5 L0 9.2 z" fill="#2E7D32"/></marker><marker id="a2E7D32s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M10 0.8 L0.4 5 L10 9.2 z" fill="#2E7D32"/></marker><marker id="a1F4E9E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0.8 L9.6 5 L0 9.2 z" fill="#1F4E9E"/></marker><marker id="a1F4E9Es" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M10 0.8 L0.4 5 L10 9.2 z" fill="#1F4E9E"/></marker><marker id="a616161" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0.8 L9.6 5 L0 9.2 z" fill="#616161"/></marker><marker id="a616161s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M10 0.8 L0.4 5 L10 9.2 z" fill="#616161"/></marker></defs>
<rect x="0" y="0" width="1120" height="780" fill="#FFFFFF"/>
<text x="24" y="32" font-size="21" fill="#212121" font-weight="600">User flow 4: device error</text>
<text x="24" y="54" font-size="14" fill="#616161">A device problem is never counted as an attempt. The screen stays open so the person can reconnect and try again.</text>
<rect x="24" y="74" width="26" height="15" rx="3" fill="#E8EEF9" stroke="#1F4E9E" stroke-width="1.5"/>
<text x="56" y="86" font-size="12" fill="#212121">What the person sees</text>
<rect x="196.72" y="74" width="26" height="15" rx="3" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="1.2"/>
<text x="228.72" y="86" font-size="12" fill="#212121">What the person does, or what happens</text>
<rect x="465.51" y="74" width="26" height="15" rx="3" fill="#E8F3E9" stroke="#2E7D32" stroke-width="1.5"/>
<text x="497.51" y="86" font-size="12" fill="#212121">Passed, or the flow goes on</text>
<rect x="669.59" y="74" width="26" height="15" rx="3" fill="#FBEAEA" stroke="#C62828" stroke-width="1.5"/>
<text x="701.59" y="86" font-size="12" fill="#212121">Failed, or blocked</text>
<rect x="30" y="112" width="250" height="90" rx="6" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="1.2"/>
<text x="155" y="143.75" font-size="12.5" fill="#212121" font-weight="600" text-anchor="middle">During any check</text>
<text x="155" y="162.75" font-size="12" fill="#212121" text-anchor="middle">The device is unplugged, the stream stalls,</text>
<text x="155" y="178.75" font-size="12" fill="#212121" text-anchor="middle">or no frames arrive</text>
<rect x="320" y="104" width="300" height="106" rx="6" fill="#FBEAEA" stroke="#C62828" stroke-width="1.5"/>
<text x="470" y="143.74" font-size="13" fill="#212121" font-weight="600" text-anchor="middle">Camera/device not available. Check the</text>
<text x="470" y="160.74" font-size="13" fill="#212121" font-weight="600" text-anchor="middle">connection and try again.</text>
<text x="470" y="179.74" font-size="12" fill="#212121" text-anchor="middle">“Attempt 1 of 4” stays. Retry, Cancel</text>
<polygon points="780,100 880,157 780,214 680,157" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="1.2"/>
<text x="780" y="152.25" font-size="12.5" fill="#212121" font-weight="600" text-anchor="middle">Device back within 3</text>
<text x="780" y="169.25" font-size="12.5" fill="#212121" font-weight="600" text-anchor="middle">seconds?</text>
<rect x="920" y="118" width="170" height="78" rx="6" fill="#E8F3E9" stroke="#2E7D32" stroke-width="1.5"/>
<text x="1005" y="143.74" font-size="13" fill="#212121" font-weight="600" text-anchor="middle">The same attempt</text>
<text x="1005" y="160.74" font-size="13" fill="#212121" font-weight="600" text-anchor="middle">restarts</text>
<text x="1005" y="179.74" font-size="12" fill="#212121" text-anchor="middle">By itself</text>
<path d="M280 157 L320 157" fill="none" stroke="#C62828" stroke-width="1.5" marker-end="url(#aC62828)"/>
<path d="M620 157 L680 157" fill="none" stroke="#C62828" stroke-width="1.5" marker-end="url(#aC62828)"/>
<path d="M880 157 L920 157" fill="none" stroke="#2E7D32" stroke-width="1.5" marker-end="url(#a2E7D32)"/>
<rect x="886.66" y="134.5" width="26.68" height="17" rx="2" fill="#FFFFFF"/>
<text x="900" y="147.2" font-size="12" fill="#2E7D32" text-anchor="middle">Yes</text>
<rect x="660" y="248" width="240" height="62" rx="6" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="1.2"/>
<text x="780" y="274.25" font-size="12.5" fill="#212121" font-weight="600" text-anchor="middle">The person reconnects the device</text>
<text x="780" y="291.25" font-size="12.5" fill="#212121" font-weight="600" text-anchor="middle">and presses Retry</text>
<path d="M780 214 L780 248" fill="none" stroke="#C62828" stroke-width="1.5" marker-end="url(#aC62828)"/>
<rect x="785" y="222.5" width="21.34" height="17" rx="2" fill="#FFFFFF"/>
<text x="788" y="235.2" font-size="12" fill="#C62828" text-anchor="start">No</text>
<polygon points="780,340 880,397 780,454 680,397" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="1.2"/>
<text x="780" y="383.75" font-size="12.5" fill="#212121" font-weight="600" text-anchor="middle">The fourth device</text>
<text x="780" y="400.75" font-size="12.5" fill="#212121" font-weight="600" text-anchor="middle">problem in this</text>
<text x="780" y="417.75" font-size="12.5" fill="#212121" font-weight="600" text-anchor="middle">session?</text>
<rect x="920" y="358" width="170" height="78" rx="6" fill="#E8F3E9" stroke="#2E7D32" stroke-width="1.5"/>
<text x="1005" y="383.74" font-size="13" fill="#212121" font-weight="600" text-anchor="middle">The same attempt</text>
<text x="1005" y="400.74" font-size="13" fill="#212121" font-weight="600" text-anchor="middle">restarts</text>
<text x="1005" y="419.74" font-size="12" fill="#212121" text-anchor="middle">Same attempt number</text>
<path d="M780 310 L780 340" fill="none" stroke="#1F4E9E" stroke-width="1.5" marker-end="url(#a1F4E9E)"/>
<path d="M880 397 L920 397" fill="none" stroke="#2E7D32" stroke-width="1.5" marker-end="url(#a2E7D32)"/>
<rect x="889.33" y="374.5" width="21.34" height="17" rx="2" fill="#FFFFFF"/>
<text x="900" y="387.2" font-size="12" fill="#2E7D32" text-anchor="middle">No</text>
<rect x="620" y="490" width="320" height="104" rx="6" fill="#FBEAEA" stroke="#C62828" stroke-width="1.5"/>
<text x="780" y="528.74" font-size="13" fill="#212121" font-weight="600" text-anchor="middle">Camera/device not available. Check the</text>
<text x="780" y="545.74" font-size="13" fill="#212121" font-weight="600" text-anchor="middle">connection and try again.</text>
<text x="780" y="564.74" font-size="12" fill="#212121" text-anchor="middle">With the workflow’s recovery text, and Close</text>
<path d="M780 454 L780 490" fill="none" stroke="#C62828" stroke-width="1.5" marker-end="url(#aC62828)"/>
<rect x="785" y="463.5" width="26.68" height="17" rx="2" fill="#FFFFFF"/>
<text x="788" y="476.2" font-size="12" fill="#C62828" text-anchor="start">Yes</text>
<rect x="960" y="514" width="130" height="56" rx="6" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="1.2"/>
<text x="1025" y="536.75" font-size="12.5" fill="#212121" font-weight="600" text-anchor="middle">Blocked</text>
<text x="1025" y="555.75" font-size="12" fill="#212121" text-anchor="middle">Nothing goes on</text>
<path d="M940 542 L960 542" fill="none" stroke="#C62828" stroke-width="1.5" marker-end="url(#aC62828)"/>
<rect x="320" y="258" width="300" height="52" rx="6" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="1.2"/>
<text x="470" y="279.25" font-size="12.5" fill="#212121" font-weight="600" text-anchor="middle">Cancel: back to the previous screen, with no</text>
<text x="470" y="296.25" font-size="12.5" fill="#212121" font-weight="600" text-anchor="middle">message</text>
<path d="M470 210 L470 258" fill="none" stroke="#616161" stroke-width="1.5" marker-end="url(#a616161)"/>
<rect x="475" y="225.5" width="43.34" height="17" rx="2" fill="#FFFFFF"/>
<text x="478" y="238.2" font-size="12" fill="#616161" text-anchor="start">Cancel</text>
<rect x="30" y="340" width="590" height="114" rx="6" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1"/>
<text x="325" y="376.24" font-size="13" fill="#212121" font-weight="600" text-anchor="middle">Why the screen stays open</text>
<text x="325" y="395.24" font-size="12" fill="#212121" text-anchor="middle">A person can plug the camera back in without leaving the screen. The first three device problems offer</text>
<text x="325" y="411.24" font-size="12" fill="#212121" text-anchor="middle">Retry, even when the device has stopped responding. Retry opens the device again. Frames left over from</text>
<text x="325" y="427.24" font-size="12" fill="#212121" text-anchor="middle">before the fault are thrown away, so they cannot resume the attempt.</text>
<rect x="30" y="618" width="1060" height="146" rx="6" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="1.2"/>
<text x="42" y="638" font-size="13" fill="#212121" font-weight="600">Android only: the camera permission</text>
<rect x="46" y="650" width="200" height="96" rx="6" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="1.2"/>
<text x="146" y="684.25" font-size="12.5" fill="#212121" font-weight="600" text-anchor="middle">The person refuses the</text>
<text x="146" y="701.25" font-size="12.5" fill="#212121" font-weight="600" text-anchor="middle">camera permission</text>
<text x="146" y="720.25" font-size="12" fill="#212121" text-anchor="middle">No session starts</text>
<rect x="286" y="650" width="330" height="96" rx="6" fill="#FBEAEA" stroke="#C62828" stroke-width="1.5"/>
<text x="451" y="684.74" font-size="13" fill="#212121" font-weight="600" text-anchor="middle">Camera/device not available. Check the</text>
<text x="451" y="701.74" font-size="13" fill="#212121" font-weight="600" text-anchor="middle">connection and try again.</text>
<text x="451" y="720.74" font-size="12" fill="#212121" text-anchor="middle">With the recovery text, and Close</text>
<rect x="656" y="650" width="190" height="96" rx="6" fill="#E8EEF9" stroke="#1F4E9E" stroke-width="1.5"/>
<text x="751" y="685.24" font-size="13" fill="#212121" font-weight="600" text-anchor="middle">Open settings</text>
<text x="751" y="704.24" font-size="12" fill="#212121" text-anchor="middle">Added when Android will no</text>
<text x="751" y="720.24" font-size="12" fill="#212121" text-anchor="middle">longer ask</text>
<rect x="886" y="650" width="190" height="96" rx="6" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="1.2"/>
<text x="981" y="676.25" font-size="12.5" fill="#212121" font-weight="600" text-anchor="middle">The person allows the</text>
<text x="981" y="693.25" font-size="12.5" fill="#212121" font-weight="600" text-anchor="middle">camera</text>
<text x="981" y="712.25" font-size="12" fill="#212121" text-anchor="middle">The next check asks nothing</text>
<text x="981" y="728.25" font-size="12" fill="#212121" text-anchor="middle">and runs</text>
<path d="M246 698 L286 698" fill="none" stroke="#C62828" stroke-width="1.5" marker-end="url(#aC62828)"/>
<path d="M616 698 L656 698" fill="none" stroke="#1F4E9E" stroke-width="1.5" marker-end="url(#a1F4E9E)"/>
<path d="M846 698 L886 698" fill="none" stroke="#1F4E9E" stroke-width="1.5" marker-end="url(#a1F4E9E)"/>
</svg>
