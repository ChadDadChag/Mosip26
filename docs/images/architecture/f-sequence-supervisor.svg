<text x="24" y="32" font-size="21" fill="#212121" font-weight="600">Sequence: supervisor authentication (Desktop classes)</text>
<text x="24" y="54" font-size="14" fill="#616161">End-of-day approval. Biometric-exception review runs the same steps from AuthenticationController. The supervisor policy gives 1 challenge, and no cooldown.</text>
