<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="900" viewBox="0 0 1120 900" role="img" aria-label="Error handling and recovery" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'Noto Sans Arabic', sans-serif">
<title>Error handling and recovery</title>
<defs><marker id="a616161" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0.8 L9.6 5 L0 9.2 z" fill="#616161"/></marker><marker id="a616161s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M10 0.8 L0.4 5 L10 9.2 z" fill="#616161"/></marker><marker id="aC62828" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0.8 L9.6 5 L0 9.2 z" fill="#C62828"/></marker><marker id="aC62828s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M10 0.8 L0.4 5 L10 9.2 z" fill="#C62828"/></marker></defs>
<rect x="0" y="0" width="1120" height="900" fill="#FFFFFF"/>
<text x="24" y="32" font-size="21" fill="#212121" font-weight="600">Error handling and recovery</text>
<text x="24" y="54" font-size="14" fill="#616161">Device errors never cost the person an attempt. Liveness failures do. Engine errors fail closed. Texts are the exact screen texts.</text>
<rect x="410" y="88" width="300" height="42" rx="6" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="1.2"/>
<text x="560" y="113.72" font-size="14" fill="#212121" font-weight="600" text-anchor="middle">What went wrong?</text>
<path d="M410 109 L207 109 Q200 109 200 116 L200 160" fill="none" stroke="#616161" stroke-width="1.5" marker-end="url(#a616161)"/>
<path d="M560 130 L560 160" fill="none" stroke="#616161" stroke-width="1.5" marker-end="url(#a616161)"/>
<path d="M710 109 L913 109 Q920 109 920 116 L920 160" fill="none" stroke="#616161" stroke-width="1.5" marker-end="url(#a616161)"/>
<rect x="30" y="160" width="340" height="34" rx="6" fill="#EFEFEF" stroke="#616161" stroke-width="1.5" stroke-dasharray="7 4"/>
<text x="200" y="181.72" font-size="14" fill="#212121" font-weight="600" text-anchor="middle">Device errors</text>
<rect x="390" y="160" width="340" height="34" rx="6" fill="#FFF4E8" stroke="#C8640A" stroke-width="1.5"/>
<text x="560" y="181.72" font-size="14" fill="#212121" font-weight="600" text-anchor="middle">Liveness failures</text>
<rect x="750" y="160" width="340" height="34" rx="6" fill="#E8EEF9" stroke="#1F4E9E" stroke-width="1.5"/>
<text x="920" y="181.72" font-size="14" fill="#212121" font-weight="600" text-anchor="middle">Engine errors</text>
<rect x="30" y="208" width="340" height="118" rx="6" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="1.2"/>
<text x="40" y="230.24" font-size="13" fill="#212121" font-weight="600" text-anchor="start">Causes</text>
<text x="40" y="249.24" font-size="12" fill="#212121" text-anchor="start">DEVICE_UNAVAILABLE,</text>
<text x="40" y="265.24" font-size="12" fill="#212121" text-anchor="start">DEVICE_CONNECTION_FAILED,</text>
<text x="40" y="281.24" font-size="12" fill="#212121" text-anchor="start">DEVICE_DISCONNECTED, CAMERA_UNAVAILABLE.</text>
<text x="40" y="297.24" font-size="12" fill="#212121" text-anchor="start">Also no frame 5 s after the start, or none for 2 s during an</text>
<text x="40" y="313.24" font-size="12" fill="#212121" text-anchor="start">attempt.</text>
<rect x="390" y="208" width="340" height="118" rx="6" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="1.2"/>
<text x="400" y="238.24" font-size="13" fill="#212121" font-weight="600" text-anchor="start">Causes</text>
<text x="400" y="257.24" font-size="12" fill="#212121" text-anchor="start">FACE_NOT_DETECTED, MULTIPLE_FACES,</text>
<text x="400" y="273.24" font-size="12" fill="#212121" text-anchor="start">POOR_QUALITY, LIVENESS_BELOW_THRESHOLD,</text>
<text x="400" y="289.24" font-size="12" fill="#212121" text-anchor="start">CHALLENGE_FAILED, CHALLENGE_TIMEOUT. Also</text>
<text x="400" y="305.24" font-size="12" fill="#212121" text-anchor="start">PAD_FAILURE and INVALID_FRAME.</text>
<rect x="750" y="208" width="340" height="118" rx="6" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="1.2"/>
<text x="760" y="246.24" font-size="13" fill="#212121" font-weight="600" text-anchor="start">Causes</text>
<text x="760" y="265.24" font-size="12" fill="#212121" text-anchor="start">ENGINE_ERROR: the analyzer fails on 3 frames in a row.</text>
<text x="760" y="281.24" font-size="12" fill="#212121" text-anchor="start">MODEL_INTEGRITY_FAILED: a bundle does not verify.</text>
<text x="760" y="297.24" font-size="12" fill="#212121" text-anchor="start">Any exception inside the gate.</text>
<rect x="30" y="340" width="340" height="130" rx="6" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="1.2"/>
<text x="40" y="392.24" font-size="13" fill="#212121" font-weight="600" text-anchor="start">What the person sees</text>
<text x="40" y="411.24" font-size="12" fill="#212121" text-anchor="start">“Camera/device not available. Check the connection and</text>
<text x="40" y="427.24" font-size="12" fill="#212121" text-anchor="start">try again.” Buttons: Retry and Cancel.</text>
<rect x="390" y="340" width="340" height="130" rx="6" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="1.2"/>
<text x="400" y="376.24" font-size="13" fill="#212121" font-weight="600" text-anchor="start">What the person sees</text>
<text x="400" y="395.24" font-size="12" fill="#212121" text-anchor="start">“We could not verify face liveness. Please try again.” with</text>
<text x="400" y="411.24" font-size="12" fill="#212121" text-anchor="start">tips, Retry and Cancel. PAD_FAILURE and</text>
<text x="400" y="427.24" font-size="12" fill="#212121" text-anchor="start">INVALID_FRAME instead show “Face verification could not</text>
<text x="400" y="443.24" font-size="12" fill="#212121" text-anchor="start">be completed. Please try again.” with no tips.</text>
<rect x="750" y="340" width="340" height="130" rx="6" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="1.2"/>
<text x="760" y="384.24" font-size="13" fill="#212121" font-weight="600" text-anchor="start">What the person sees</text>
<text x="760" y="403.24" font-size="12" fill="#212121" text-anchor="start">ENGINE_ERROR, first time: “Face verification could not be</text>
<text x="760" y="419.24" font-size="12" fill="#212121" text-anchor="start">completed. Please try again.” with Retry and Cancel. The</text>
<text x="760" y="435.24" font-size="12" fill="#212121" text-anchor="start">failure never names the engine, a model or a reason.</text>
<rect x="30" y="484" width="340" height="108" rx="6" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="1.2"/>
<text x="40" y="517.24" font-size="13" fill="#212121" font-weight="600" text-anchor="start">Effect on attempts</text>
<text x="40" y="536.24" font-size="12" fill="#212121" text-anchor="start">Not an attempt. Frames back within 3 s: the same attempt</text>
<text x="40" y="552.24" font-size="12" fill="#212121" text-anchor="start">restarts by itself. Retry restarts the source, with the same</text>
<text x="40" y="568.24" font-size="12" fill="#212121" text-anchor="start">attempt number.</text>
<rect x="390" y="484" width="340" height="108" rx="6" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="1.2"/>
<text x="400" y="517.24" font-size="13" fill="#212121" font-weight="600" text-anchor="start">Effect on attempts</text>
<text x="400" y="536.24" font-size="12" fill="#212121" text-anchor="start">Uses one of 4 attempts. Retry keeps the session: a new</text>
<text x="400" y="552.24" font-size="12" fill="#212121" text-anchor="start">window and a new challenge order, and the PAD latch</text>
<text x="400" y="568.24" font-size="12" fill="#212121" text-anchor="start">stays.</text>
<rect x="750" y="484" width="340" height="108" rx="6" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="1.2"/>
<text x="760" y="517.24" font-size="13" fill="#212121" font-weight="600" text-anchor="start">Effect on attempts</text>
<text x="760" y="536.24" font-size="12" fill="#212121" text-anchor="start">ENGINE_ERROR uses no attempt.</text>
<text x="760" y="552.24" font-size="12" fill="#212121" text-anchor="start">MODEL_INTEGRITY_FAILED skips this step and ends the</text>
<text x="760" y="568.24" font-size="12" fill="#212121" text-anchor="start">session at once.</text>
<rect x="30" y="606" width="340" height="92" rx="6" fill="#FBEAEA" stroke="#C62828" stroke-width="1.5"/>
<text x="40" y="639.24" font-size="13" fill="#212121" font-weight="600" text-anchor="start">Limit</text>
<text x="40" y="658.24" font-size="12" fill="#212121" text-anchor="start">The 4th device error in a session ends it, with the device</text>
<text x="40" y="674.24" font-size="12" fill="#212121" text-anchor="start">text and the recovery text.</text>
<rect x="390" y="606" width="340" height="92" rx="6" fill="#FBEAEA" stroke="#C62828" stroke-width="1.5"/>
<text x="400" y="639.24" font-size="13" fill="#212121" font-weight="600" text-anchor="start">Limit</text>
<text x="400" y="658.24" font-size="12" fill="#212121" text-anchor="start">The 4th failed attempt ends the session as</text>
<text x="400" y="674.24" font-size="12" fill="#212121" text-anchor="start">MAX_RETRIES_EXCEEDED. Operator: 60 s cooldown.</text>
<rect x="750" y="606" width="340" height="92" rx="6" fill="#FBEAEA" stroke="#C62828" stroke-width="1.5"/>
<text x="760" y="639.24" font-size="13" fill="#212121" font-weight="600" text-anchor="start">Limit</text>
<text x="760" y="658.24" font-size="12" fill="#212121" text-anchor="start">A second ENGINE_ERROR attempt ends the session. An</text>
<text x="760" y="674.24" font-size="12" fill="#212121" text-anchor="start">exception in the gate opens the fail-closed screen at once.</text>
<path d="M200 326 L200 340" fill="none" stroke="#616161" stroke-width="1.5" marker-end="url(#a616161)"/>
<path d="M200 470 L200 484" fill="none" stroke="#616161" stroke-width="1.5" marker-end="url(#a616161)"/>
<path d="M200 592 L200 606" fill="none" stroke="#616161" stroke-width="1.5" marker-end="url(#a616161)"/>
<path d="M200 194 L200 208" fill="none" stroke="#616161" stroke-width="1.5" marker-end="url(#a616161)"/>
<path d="M200 698 L200 728" fill="none" stroke="#C62828" stroke-width="1.5" marker-end="url(#aC62828)"/>
<path d="M560 326 L560 340" fill="none" stroke="#616161" stroke-width="1.5" marker-end="url(#a616161)"/>
<path d="M560 470 L560 484" fill="none" stroke="#616161" stroke-width="1.5" marker-end="url(#a616161)"/>
<path d="M560 592 L560 606" fill="none" stroke="#616161" stroke-width="1.5" marker-end="url(#a616161)"/>
<path d="M560 194 L560 208" fill="none" stroke="#616161" stroke-width="1.5" marker-end="url(#a616161)"/>
<path d="M560 698 L560 728" fill="none" stroke="#C62828" stroke-width="1.5" marker-end="url(#aC62828)"/>
<path d="M920 326 L920 340" fill="none" stroke="#616161" stroke-width="1.5" marker-end="url(#a616161)"/>
<path d="M920 470 L920 484" fill="none" stroke="#616161" stroke-width="1.5" marker-end="url(#a616161)"/>
<path d="M920 592 L920 606" fill="none" stroke="#616161" stroke-width="1.5" marker-end="url(#a616161)"/>
<path d="M920 194 L920 208" fill="none" stroke="#616161" stroke-width="1.5" marker-end="url(#a616161)"/>
<path d="M920 698 L920 728" fill="none" stroke="#C62828" stroke-width="1.5" marker-end="url(#aC62828)"/>
<rect x="30" y="728" width="1060" height="78" rx="6" fill="#FBEAEA" stroke="#C62828" stroke-width="1.5"/>
<text x="560" y="754.24" font-size="13" fill="#212121" font-weight="600" text-anchor="middle">Session over: the gate returns BLOCKED</text>
<text x="560" y="773.24" font-size="12" fill="#212121" text-anchor="middle">No face is stored, no login completes, nothing is approved. The screen shows “Face verification could not be completed.” with the workflow’s recovery text and Close. After a device failure it</text>
<text x="560" y="789.24" font-size="12" fill="#212121" text-anchor="middle">shows the device text instead.</text>
<rect x="30" y="820" width="1060" height="62" rx="6" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1"/>
<text x="560" y="846.24" font-size="13" fill="#212121" font-weight="600" text-anchor="middle">Cancel, at any time before the end</text>
<text x="560" y="865.24" font-size="12" fill="#212121" text-anchor="middle">The session ends as CANCELLED and the screen closes with no message. The person is back where they were, and nothing changes.</text>
</svg>
