<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="896" viewBox="0 0 1120 896" role="img" aria-label="Frame-to-decision data flow" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'Noto Sans Arabic', sans-serif">
<title>Frame-to-decision data flow</title>
<defs><marker id="a1F4E9E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0.8 L9.6 5 L0 9.2 z" fill="#1F4E9E"/></marker><marker id="a1F4E9Es" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M10 0.8 L0.4 5 L10 9.2 z" fill="#1F4E9E"/></marker></defs>
<rect x="0" y="0" width="1120" height="896" fill="#FFFFFF"/>
<text x="24" y="32" font-size="21" fill="#212121" font-weight="600">Frame-to-decision data flow</text>
<text x="24" y="54" font-size="14" fill="#616161">Every step in order, with the real models. Steps 3 to 7 run once per analysed frame. PAD means Presentation Attack Detection.</text>
<text x="80" y="93" font-size="13" fill="#616161" font-weight="600">Step</text>
<text x="284" y="93" font-size="13" fill="#616161" font-weight="600">Done by</text>
<text x="668" y="93" font-size="13" fill="#616161" font-weight="600">What it produces</text>
<text x="72" y="117" font-size="13" fill="#1F4E9E" font-weight="600">In the frame source and the session</text>
<rect x="72" y="124" width="1024" height="62" rx="6" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="1.2"/>
<line x1="276" y1="129" x2="276" y2="181" stroke="#BDBDBD" stroke-width="1"/>
<line x1="660" y1="129" x2="660" y2="181" stroke="#BDBDBD" stroke-width="1"/>
<text x="80" y="159" font-size="12" fill="#212121" font-weight="600">Frame arrives</text>
<text x="284" y="143" font-size="12" fill="#212121">Desktop: SbiStreamFrameSource reads the SBI (Secure Biometric</text>
<text x="284" y="159" font-size="12" fill="#212121">Interface) /stream and decodes each JPEG. Android:</text>
<text x="284" y="175" font-size="12" fill="#212121">CameraXFrameSource converts YUV to RGB.</text>
<text x="668" y="151" font-size="12" fill="#212121">Frame: pixels, width, height, timestamp, sequence, device id. Upright. Never</text>
<text x="668" y="167" font-size="12" fill="#212121">mirrored; only the on-screen preview is.</text>
<circle cx="44" cy="155" r="13" fill="#1F4E9E"/>
<text x="44" y="159.5" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text>
<rect x="72" y="193" width="1024" height="46" rx="6" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="1.2"/>
<line x1="276" y1="198" x2="276" y2="234" stroke="#BDBDBD" stroke-width="1"/>
<line x1="660" y1="198" x2="660" y2="234" stroke="#BDBDBD" stroke-width="1"/>
<text x="80" y="220" font-size="12" fill="#212121" font-weight="600">Newest frame picked</text>
<text x="284" y="220" font-size="12" fill="#212121">FramePump keeps one slot. An older unread frame is overwritten.</text>
<text x="668" y="212" font-size="12" fill="#212121">One frame for analysis: 8 a second in the passive phase, up to 15 during</text>
<text x="668" y="228" font-size="12" fill="#212121">challenges. Dropped frames are counted.</text>
<circle cx="44" cy="216" r="13" fill="#1F4E9E"/>
<text x="44" y="220.5" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text>
<path d="M44 168 L44 203" fill="none" stroke="#1F4E9E" stroke-width="1.5" marker-end="url(#a1F4E9E)"/>
<text x="72" y="264" font-size="13" fill="#1F4E9E" font-weight="600">In OnnxFaceAnalyzer, on ONNX (Open Neural Network Exchange) Runtime</text>
<rect x="72" y="271" width="1024" height="46" rx="6" fill="#E8EEF9" stroke="#1F4E9E" stroke-width="1.5"/>
<line x1="276" y1="276" x2="276" y2="312" stroke="#BDBDBD" stroke-width="1"/>
<line x1="660" y1="276" x2="660" y2="312" stroke="#BDBDBD" stroke-width="1"/>
<text x="80" y="298" font-size="12" fill="#212121" font-weight="600">Detect faces</text>
<text x="284" y="290" font-size="12" fill="#212121">YuNet, on a copy at most 320 px wide. A second face counts only</text>
<text x="284" y="306" font-size="12" fill="#212121">from 20% of the largest face’s area.</text>
<text x="668" y="290" font-size="12" fill="#212121">Face count and face box. Not exactly one face: no score for this frame, and the</text>
<text x="668" y="306" font-size="12" fill="#212121">session’s moiré and volatility windows are cleared.</text>
<circle cx="44" cy="294" r="13" fill="#1F4E9E"/>
<text x="44" y="298.5" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text>
<path d="M44 229 L44 281" fill="none" stroke="#1F4E9E" stroke-width="1.5" marker-end="url(#a1F4E9E)"/>
<rect x="72" y="324" width="1024" height="46" rx="6" fill="#E8EEF9" stroke="#1F4E9E" stroke-width="1.5"/>
<line x1="276" y1="329" x2="276" y2="365" stroke="#BDBDBD" stroke-width="1"/>
<line x1="660" y1="329" x2="660" y2="365" stroke="#BDBDBD" stroke-width="1"/>
<text x="80" y="351" font-size="12" fill="#212121" font-weight="600">Check quality and screen cues</text>
<text x="284" y="343" font-size="12" fill="#212121">Brightness, clipped highlights, blur, size, centring, cut-off, moiré,</text>
<text x="284" y="359" font-size="12" fill="#212121">glare.</text>
<text x="668" y="343" font-size="12" fill="#212121">Quality issues: TOO_DARK, TOO_BRIGHT, BLURRY, FACE_TOO_SMALL,</text>
<text x="668" y="359" font-size="12" fill="#212121">FACE_TOO_LARGE, FACE_OFF_CENTER, FACE_CUT_OFF.</text>
<circle cx="44" cy="347" r="13" fill="#1F4E9E"/>
<text x="44" y="351.5" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">4</text>
<path d="M44 307 L44 334" fill="none" stroke="#1F4E9E" stroke-width="1.5" marker-end="url(#a1F4E9E)"/>
<rect x="72" y="377" width="1024" height="46" rx="6" fill="#E8EEF9" stroke="#1F4E9E" stroke-width="1.5"/>
<line x1="276" y1="382" x2="276" y2="418" stroke="#BDBDBD" stroke-width="1"/>
<line x1="660" y1="382" x2="660" y2="418" stroke="#BDBDBD" stroke-width="1"/>
<text x="80" y="404" font-size="12" fill="#212121" font-weight="600">Find landmarks and head pose</text>
<text x="284" y="396" font-size="12" fill="#212121">FaceMesh V2: 478 points. Tracks from the last frame’s landmarks</text>
<text x="284" y="412" font-size="12" fill="#212121">when it can.</text>
<text x="668" y="396" font-size="12" fill="#212121">Eye, mouth, nose and chin landmarks, plus yaw, pitch and roll. No mesh: no</text>
<text x="668" y="412" font-size="12" fill="#212121">score.</text>
<circle cx="44" cy="400" r="13" fill="#1F4E9E"/>
<text x="44" y="404.5" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">5</text>
<path d="M44 360 L44 387" fill="none" stroke="#1F4E9E" stroke-width="1.5" marker-end="url(#a1F4E9E)"/>
<rect x="72" y="430" width="1024" height="46" rx="6" fill="#E8EEF9" stroke="#1F4E9E" stroke-width="1.5"/>
<line x1="276" y1="435" x2="276" y2="471" stroke="#BDBDBD" stroke-width="1"/>
<line x1="660" y1="435" x2="660" y2="471" stroke="#BDBDBD" stroke-width="1"/>
<text x="80" y="457" font-size="12" fill="#212121" font-weight="600">Score liveness</text>
<text x="284" y="449" font-size="12" fill="#212121">MiniFASNet V2 on a 2.7× crop and MiniFASNet V1SE on a 4.0×</text>
<text x="284" y="465" font-size="12" fill="#212121">crop, each resized to 80 × 80.</text>
<text x="668" y="449" font-size="12" fill="#212121">Score from 0 to 1: the mean of the two models’ “real” probability. Outside</text>
<text x="668" y="465" font-size="12" fill="#212121">yaw 30° or pitch 25°: no score.</text>
<circle cx="44" cy="453" r="13" fill="#1F4E9E"/>
<text x="44" y="457.5" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">6</text>
<path d="M44 413 L44 440" fill="none" stroke="#1F4E9E" stroke-width="1.5" marker-end="url(#a1F4E9E)"/>
<rect x="72" y="483" width="1024" height="46" rx="6" fill="#E8EEF9" stroke="#1F4E9E" stroke-width="1.5"/>
<line x1="276" y1="488" x2="276" y2="524" stroke="#BDBDBD" stroke-width="1"/>
<line x1="660" y1="488" x2="660" y2="524" stroke="#BDBDBD" stroke-width="1"/>
<text x="80" y="510" font-size="12" fill="#212121" font-weight="600">Apply session caps</text>
<text x="284" y="502" font-size="12" fill="#212121">Moiré cap (rolling median at 1.40 or more), PAD latch (3-frame</text>
<text x="284" y="518" font-size="12" fill="#212121">median below 0.30), volatility cap (second-lowest of 10 below 0.85).</text>
<text x="668" y="502" font-size="12" fill="#212121">Score held at 0.60 or less. That forces a challenge and never rejects. Result:</text>
<text x="668" y="518" font-size="12" fill="#212121">one FrameAnalysis per frame.</text>
<circle cx="44" cy="506" r="13" fill="#1F4E9E"/>
<text x="44" y="510.5" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">7</text>
<path d="M44 466 L44 493" fill="none" stroke="#1F4E9E" stroke-width="1.5" marker-end="url(#a1F4E9E)"/>
<text x="72" y="554" font-size="13" fill="#1F4E9E" font-weight="600">In the engine: DefaultLivenessSession</text>
<rect x="72" y="561" width="1024" height="38" rx="6" fill="#FFF4E8" stroke="#C8640A" stroke-width="1.5"/>
<line x1="276" y1="566" x2="276" y2="594" stroke="#BDBDBD" stroke-width="1"/>
<line x1="660" y1="566" x2="660" y2="594" stroke="#BDBDBD" stroke-width="1"/>
<text x="80" y="584" font-size="12" fill="#212121" font-weight="600">Decide passively</text>
<text x="284" y="584" font-size="12" fill="#212121">PassiveEvaluator: median score of 10 eligible frames.</text>
<text x="668" y="584" font-size="12" fill="#212121">At 0.85 or above: pass. Below 0.30: PAD failure. In between: challenges.</text>
<circle cx="44" cy="580" r="13" fill="#1F4E9E"/>
<text x="44" y="584.5" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">8</text>
<path d="M44 519 L44 567" fill="none" stroke="#1F4E9E" stroke-width="1.5" marker-end="url(#a1F4E9E)"/>
<rect x="72" y="606" width="1024" height="62" rx="6" fill="#FFF4E8" stroke="#C8640A" stroke-width="1.5"/>
<line x1="276" y1="611" x2="276" y2="663" stroke="#BDBDBD" stroke-width="1"/>
<line x1="660" y1="611" x2="660" y2="663" stroke="#BDBDBD" stroke-width="1"/>
<text x="80" y="641" font-size="12" fill="#212121" font-weight="600">Run challenges</text>
<text x="284" y="625" font-size="12" fill="#212121">ChallengeRunner with BlinkDetector, SmileDetector,</text>
<text x="284" y="641" font-size="12" fill="#212121">HeadTurnDetector, plus PadMonitor and FaceContinuityGuard on</text>
<text x="284" y="657" font-size="12" fill="#212121">every frame.</text>
<text x="668" y="633" font-size="12" fill="#212121">Action detected, or the attempt fails: wrong action, timeout, PAD, face lost,</text>
<text x="668" y="649" font-size="12" fill="#212121">several faces, face changed.</text>
<circle cx="44" cy="637" r="13" fill="#1F4E9E"/>
<text x="44" y="641.5" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">9</text>
<path d="M44 593 L44 624" fill="none" stroke="#1F4E9E" stroke-width="1.5" marker-end="url(#a1F4E9E)"/>
<rect x="72" y="675" width="1024" height="46" rx="6" fill="#FFF4E8" stroke="#C8640A" stroke-width="1.5"/>
<line x1="276" y1="680" x2="276" y2="716" stroke="#BDBDBD" stroke-width="1"/>
<line x1="660" y1="680" x2="660" y2="716" stroke="#BDBDBD" stroke-width="1"/>
<text x="80" y="702" font-size="12" fill="#212121" font-weight="600">Pick the best frame</text>
<text x="284" y="694" font-size="12" fill="#212121">BestFrameSelector and Iso19794Check: sharpness, frontal pose,</text>
<text x="284" y="710" font-size="12" fill="#212121">size, eyes open.</text>
<text x="668" y="694" font-size="12" fill="#212121">Best frame, in memory. Its ISO/IEC 19794-5 result goes to audit as numbers</text>
<text x="668" y="710" font-size="12" fill="#212121">and names, never pixels.</text>
<circle cx="44" cy="698" r="13" fill="#1F4E9E"/>
<text x="44" y="702.5" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">10</text>
<path d="M44 650 L44 685" fill="none" stroke="#1F4E9E" stroke-width="1.5" marker-end="url(#a1F4E9E)"/>
<rect x="72" y="728" width="1024" height="38" rx="6" fill="#FFF4E8" stroke="#C8640A" stroke-width="1.5"/>
<line x1="276" y1="733" x2="276" y2="761" stroke="#BDBDBD" stroke-width="1"/>
<line x1="660" y1="733" x2="660" y2="761" stroke="#BDBDBD" stroke-width="1"/>
<text x="80" y="751" font-size="12" fill="#212121" font-weight="600">Return the result</text>
<text x="284" y="751" font-size="12" fill="#212121">onComplete(LivenessResult), called exactly once.</text>
<text x="668" y="751" font-size="12" fill="#212121">Decision, pass path, best frame, attempts, duration, session id, model version.</text>
<circle cx="44" cy="747" r="13" fill="#1F4E9E"/>
<text x="44" y="751.5" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">11</text>
<path d="M44 711 L44 734" fill="none" stroke="#1F4E9E" stroke-width="1.5" marker-end="url(#a1F4E9E)"/>
<text x="72" y="791" font-size="13" fill="#616161" font-weight="600">In the client, after PASSED</text>
<rect x="72" y="798" width="1024" height="78" rx="6" fill="#EFEFEF" stroke="#616161" stroke-width="1.5" stroke-dasharray="7 4"/>
<line x1="276" y1="803" x2="276" y2="871" stroke="#BDBDBD" stroke-width="1"/>
<line x1="660" y1="803" x2="660" y2="871" stroke="#BDBDBD" stroke-width="1"/>
<text x="80" y="841" font-size="12" fill="#212121" font-weight="600">Bind the face</text>
<text x="284" y="817" font-size="12" fill="#212121">SFace through FaceMatcher. After an SBI capture: FaceBinding</text>
<text x="284" y="833" font-size="12" fill="#212121">compares it with the best frame, match at cosine 0.45. After a</text>
<text x="284" y="849" font-size="12" fill="#212121">password-only gate: IdentityBinding compares the best frame with</text>
<text x="284" y="865" font-size="12" fill="#212121">the onboarded face, match at 0.40.</text>
<text x="668" y="833" font-size="12" fill="#212121">MATCH: the face is stored, or the step goes on. Anything else: rejected,</text>
<text x="668" y="849" font-size="12" fill="#212121">nothing stored.</text>
<circle cx="44" cy="837" r="13" fill="#1F4E9E"/>
<text x="44" y="841.5" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">12</text>
<path d="M44 760 L44 824" fill="none" stroke="#1F4E9E" stroke-width="1.5" marker-end="url(#a1F4E9E)"/>
</svg>
