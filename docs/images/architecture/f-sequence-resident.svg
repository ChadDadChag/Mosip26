<text x="24" y="32" font-size="21" fill="#212121" font-weight="600">Sequence: resident face capture (Desktop classes)</text>
<text x="24" y="54" font-size="14" fill="#616161">Blue arrows are calls, grey dashed arrows are events and returns, orange arrows are audit records. Android has the same steps; see the table in the text.</text>
